# O braço tem 3 GDL, então não existe solução de IK para uma pose
# completa (6 GDL). position_only_ik faz o KDL resolver apenas a
# posição do TCP e ignorar a orientação, que é o único modo coerente
# para este robô.

arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  position_only_ik: true
